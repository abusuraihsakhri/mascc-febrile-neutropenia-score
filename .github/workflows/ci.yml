name: Tests and security checks
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and tests
        run: python -m pip install -e ".[dev]"
      - name: Compile Python
        run: python -m compileall -q .
      - name: Test
        run: python -m pytest -q
      - name: Command line smoke check
        run: mascc single --burden none_mild --no-hypotension yes --no-copd yes --favorable-malignancy yes --no-dehydration yes --outpatient-onset yes --age-under-60 yes
      - name: Check client-side script syntax
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.inside = False
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      self.inside = True
              def handle_endtag(self, tag):
                  if tag == "script":
                      self.inside = False
              def handle_data(self, data):
                  if self.inside:
                      self.scripts.append(data)
          parser = Scripts()
          parser.feed(Path("index.html").read_text())
          Path("/tmp/mascc-ui.js").write_text("\n".join(parser.scripts))
          PY
          node --check /tmp/mascc-ui.js
